[workspace]
members = [
    "crates/quanta-memory-platform-core",
    "crates/quanta-memory-platform-facade",
    "crates/quanta-memory-platform-testkit",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.95"
version = "0.2.0"

[workspace.dependencies]
blake3 = "=1.5.3"
hdrhistogram = "7.5.4"
hashlink = "0.12.1"
metrics = "0.24.2"
loom = "0.7.2"
proptest = "1.11.0"
redb = "2.2.0"
tracking-allocator = "0.4.0"
