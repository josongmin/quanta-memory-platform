[workspace]
members = [
    "crates/quanta-memory-platform-core",
    "crates/quanta-memory-platform-facade",
    "crates/quanta-memory-platform-testkit",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
version = "0.1.0"

[workspace.dependencies]
blake3 = "=1.5.3"
hdrhistogram = "7.5.4"
hashlink = "0.12.1"
metrics = "0.24.2"
moka = { version = "0.12.10", features = ["sync"] }
redb = "2.2.0"
scc = "3.8.7"
tracking-allocator = "0.4.0"
