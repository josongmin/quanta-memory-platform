[advisories]
version = 2
ignore = []

[licenses]
version = 2
# The workspace crates are unpublished internal members declared
# `license = "UNLICENSED"`, which is not a valid SPDX expression. Treat private
# (unpublished) crates as license-exempt so the rail validates third-party deps
# only, not our own internal members.
private = { ignore = true }
# Only licenses actually encountered in the full (`--all-features`) dependency
# graph are listed, so the allow-list stays drift-free: an unencountered
# allowance surfaces as a warning, and a newly introduced license fails closed.
# MPL-2.0 (tracking-allocator, testkit `alloc_tracking` only) is file-scope
# copyleft and is accepted for this internal library; revisit if it reaches a
# distributed binary surface.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "deny"
