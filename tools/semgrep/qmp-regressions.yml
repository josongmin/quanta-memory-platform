# Regression guards for accounting and Sep-26 bugbash regressions.
#
# Each rule pins a SPECIFIC defect this codebase already hit, so the same shape
# cannot silently come back after owner-local module moves. They are intentionally narrow (the broad clippy cast
# lints are too noisy for this byte-accounting code); if a flagged use is provably
# safe, justify it with a trailing `// nosemgrep: <rule-id> -- reason: <why>`.
#
# Run via `scripts/regression-guards.sh` (wired into check-workspace.sh).
rules:
  - id: qmp-magnitude-as-signed
    languages: [rust]
    severity: ERROR
    message: >-
      Casting a value to a signed integer with `as i64/i32/i16/i8` can sign-flip a
      large magnitude. This is the fake-ledger `bytes as i64` bug: a byte count
      > i64::MAX wrapped negative and silently SUBTRACTED, corrupting the counters
      and breaking ledger invariant 1. Keep byte/budget magnitudes as `u64` with
      saturating/checked ops, or use `i64::try_from(..)?`. For a signed DIFFERENCE,
      widen to `i128` (lossless for u64). If genuinely safe, append
      `// nosemgrep: qmp-magnitude-as-signed -- reason: <why>`.
    patterns:
      - pattern-either:
          - pattern: $X as i64
          - pattern: $X as i32
          - pattern: $X as i16
          - pattern: $X as i8

  - id: qmp-saturating-mul-then-divide
    languages: [rust]
    severity: ERROR
    message: >-
      `a.saturating_mul(b) / c` saturates the product BEFORE the divide, which
      rounds the ratio DOWN (the unsafe direction) once `a*b` exceeds u64 — the
      pressure-percent and weighted-cap under-report bug. Compute the ratio in
      u128 instead: `u64::try_from(u128::from(a) * u128::from(b) / u128::from(c))`.
      If `a*b` provably cannot overflow, append
      `// nosemgrep: qmp-saturating-mul-then-divide -- reason: <why>`.
    patterns:
      - pattern: $A.saturating_mul($B) / $C

  - id: qmp-atomic-fetch-sub
    languages: [rust]
    severity: ERROR
    message: >-
      `AtomicU*::fetch_sub` can underflow and WRAP to the max value — the
      spilled-count drift bug, where a concurrent decrement drove the counter
      negative. Decrement with a saturating compare-and-set instead:
      `c.fetch_update(SeqCst, SeqCst, |v| Some(v.saturating_sub(n)))`. If the
      value provably cannot underflow here, append
      `// nosemgrep: qmp-atomic-fetch-sub -- reason: <why>`.
    patterns:
      - pattern: $A.fetch_sub($N, $O)

  - id: qmp-wrapping-mul-then-divide
    languages: [rust]
    severity: ERROR
    message: A wrapping product under-reports pressure ratios. Widen the product to u128 before division.
    pattern: $A.wrapping_mul($B) / $C

  - id: qmp-exact-ledger-no-saturation
    languages: [rust]
    severity: ERROR
    message: Exact ledger slots and totals must reject overflow/underflow rather than hide it with saturation. Use checked arithmetic after preflight.
    paths:
      include: [/crates/quanta-memory-platform-core/src/domain/**/*.rs]
    patterns:
      - pattern-either:
          - pattern-inside: |
              impl UsageBreakdown { ... }
          - pattern-inside: |
              impl LedgerSnapshot { ... }
      - pattern-either:
          - pattern: $A.saturating_add($B)
          - pattern: $A.saturating_sub($B)
          - pattern: u64::saturating_add
          - pattern: u64::saturating_sub

  - id: qmp-release-preflight-no-owner-scan
    languages: [rust]
    severity: ERROR
    message: Release preflight must use keyed owner reads, not whole-owner iteration or snapshot copying. Keep the metered complexity oracle too.
    paths:
      include: [/crates/quanta-memory-platform-core/src/domain/**/*.rs]
    patterns:
      - pattern-inside: |
          fn preflight_release_batch(...) -> $RET { ... }
      - pattern-either:
          - pattern: self.owner_usage.iter()
          - pattern: self.owner_usage.values()
          - pattern: self.owner_usage.keys()
          - pattern: self.owner_usage.into_iter()
          - pattern: self.snapshot()
          - pattern: for $ITEM in &self.owner_usage { ... }

  - id: qmp-admission-no-share-recompute
    languages: [rust]
    severity: ERROR
    message: Admission must borrow the cached fair-share table. Precompute shares when constructing the scheduler.
    paths:
      include: [/crates/quanta-memory-platform-core/src/application/**/*.rs]
    patterns:
      - pattern-inside: |
          fn admits(...) -> $RET { ... }
      - pattern: admission::precompute_fair_burst_shares(...)

  - id: qmp-allocator-observation-no-pressure-write
    languages: [rust]
    severity: ERROR
    message: Allocator observation is advisory and cannot update semantic pressure. Keep ledger/cache postimage tests.
    paths:
      include: [/crates/quanta-memory-platform-core/src/api/**/*.rs]
    patterns:
      - pattern-inside: |
          pub fn observe_allocator(...) -> $RET { ... }
      - pattern: $CONTROLLER.update_from_semantic(...)

  - id: qmp-scratch-peak-monotonic
    languages: [rust]
    severity: ERROR
    message: Scratch observation is a high-water mark. Update it with max(previous, observed).
    paths:
      include: [/crates/quanta-memory-platform-core/src/ports/**/*.rs]
    patterns:
      - pattern-inside: |
          pub fn grow_to_observed(...) -> $RET { ... }
      - pattern-either:
          - patterns:
              - pattern: self.observed_bytes = $VALUE
              - pattern-not: self.observed_bytes = self.observed_bytes.max($OBSERVED)
          - pattern: self.observed_bytes += $VALUE
          - pattern: self.observed_bytes -= $VALUE
          - pattern: self.observed_bytes *= $VALUE
          - pattern: self.observed_bytes /= $VALUE
          - pattern: self.observed_bytes %= $VALUE
          - pattern: self.observed_bytes &= $VALUE
          - pattern: self.observed_bytes |= $VALUE
          - pattern: self.observed_bytes ^= $VALUE
          - pattern: self.observed_bytes <<= $VALUE
          - pattern: self.observed_bytes >>= $VALUE

  - id: qmp-threshold-fields-private
    languages: [rust]
    severity: ERROR
    message: Pressure thresholds must remain sealed behind validated constructors; public fields bypass validation.
    paths:
      include: [/crates/quanta-memory-platform-core/src/application/**/*.rs]
    pattern-either:
      - pattern: 'pub struct PressureThresholds { ..., pub $FIELD: $TYPE, ... }'
      - pattern: 'pub struct PressureThresholds { ..., pub(crate) $FIELD: $TYPE, ... }'

  - id: qmp-persistent-publication-metadata-kind
    languages: [rust]
    severity: ERROR
    message: The persistent identity/tombstone lease must be RetainedMetadata, independently of the active payload lease.
    paths:
      include: [/crates/quanta-memory-platform-facade/src/publish_pipeline/**/*.rs]
    patterns:
      - pattern: $ACCOUNTING.charge($CLASS, $OWNER, $CONTEXT, $KIND, persistent_bytes)
      - metavariable-pattern:
          metavariable: $KIND
          patterns:
            - pattern-not: ChargeKind::RetainedMetadata

  - id: qmp-store-digest-seed-construction
    languages: [rust]
    severity: ERROR
    message: Construct a fresh RandomState for each payload store. A shared or deterministic seed permits cross-store bucket grinding.
    paths:
      include: [/crates/quanta-memory-platform-facade/src/payload_store/**/*.rs]
    patterns:
      - pattern-inside: |
          fn with_accounting(...) -> $RET { ... }
      - pattern-regex: '\bdigest_seed\s*:\s*(?!RandomState\s*::\s*new\s*\(\s*\))\S'

  - id: qmp-cleanup-result-not-erased
    languages: [rust]
    severity: ERROR
    message: Preserve cleanup errors and exact rollback authority. Do not turn a release/rollback Result into an unused Option.
    pattern-either:
      - pattern: $OWNER.release(...).ok();
      - pattern: $OWNER.rollback_pending(...).ok();
      - pattern: $OWNER.abort_restore(...).ok();
      - pattern: $OWNER.finalize_restore(...).ok();

  - id: qmp-durable-no-watermark-resolution
    languages: [rust]
    severity: ERROR
    message: The legacy finalized watermark cannot distinguish reserved holes. Resolve records from exact disposition/proof rows.
    paths:
      include: [/crates/quanta-memory-platform-facade/src/spill/**/*.rs]
    patterns:
      - pattern-either:
          - pattern: $TABLE.get(FINALIZED_THROUGH)
          - pattern: $TABLE.insert(FINALIZED_THROUGH, ...)

  - id: qmp-kit-no-constant-pass
    languages: [rust]
    severity: ERROR
    message: The public kit dispatcher must fold the actual conformance suite, never manufacture a Passed verdict.
    paths:
      include: [/crates/quanta-memory-platform-testkit/src/fixtures/**/*.rs]
    patterns:
      - pattern-inside: |
          pub fn run_conformance(...) -> $RET { ... }
      - pattern: ConformanceVerdict::Passed

  - id: qmp-facade-suite-required-slices
    languages: [rust]
    severity: ERROR
    message: The facade suite must compose payload, retained-map, transcript and spill slices. Runtime assertion-name inventory remains authoritative for completeness.
    paths:
      include: [/crates/quanta-memory-platform-testkit/src/conformance/**/*.rs]
    pattern-either:
      - patterns:
          - pattern: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... }
          - pattern-not: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... run_payload_store_slice(...); ... }
      - patterns:
          - pattern: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... }
          - pattern-not: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... run_retained_map_slice(...); ... }
      - patterns:
          - pattern: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... }
          - pattern-not: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... run_transcript_slice(...); ... }
      - patterns:
          - pattern: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... }
          - pattern-not: pub fn run_facade_store_suite(...) -> Vec<$VERDICT> { ... run_spill_slice(...); ... }

  - id: qmp-isolated-child-requires-selection-guard
    languages: [rust]
    severity: ERROR
    message: Launch the sealed handle returned by require_one_test. The mutable builder remains unchecked; exit zero also succeeds for stale filters.
    paths:
      include: [/crates/quanta-memory-platform-facade/src/**/*.rs]
      exclude: [/crates/quanta-memory-platform-facade/src/test_support.rs]
    mode: taint
    pattern-sources:
      - pattern: std::env::current_exe(...)
    pattern-sanitizers:
      - pattern: $COMMAND.require_one_test()
    pattern-sinks:
      - pattern-either:
          - pattern: $COMMAND.output()
          - pattern: $COMMAND.spawn()
          - pattern: $COMMAND.status()

  - id: qmp-pure-layer-no-fs-env
    languages: [rust]
    severity: ERROR
    message: >-
      domain/ and ports/ are pure. Route filesystem/environment access through
      a port implemented by an adapter.
    paths:
      include:
        - /crates/quanta-memory-platform-core/src/domain/**/*.rs
        - /crates/quanta-memory-platform-core/src/ports/**/*.rs
    pattern-either:
      - pattern: std::fs::$FUNC(...)
      - pattern: std::fs::$TYPE::$FUNC(...)
      - pattern: std::env::$FUNC(...)
      - pattern-regex: 'std::(?:fs|env)::[A-Za-z_][A-Za-z0-9_:]*'
      - pattern-regex: '(?ms)^\s*(?:pub(?:\([^)]*\))?\s+)?use\s+std::(?:(?:fs|env)\b|\{[^;]*(?:fs|env)\b)'

  - id: qmp-pure-layer-no-wall-clock
    languages: [rust]
    severity: ERROR
    message: >-
      domain/ and ports/ may not read the wall or monotonic clock directly.
      Inject time through a port.
    paths:
      include:
        - /crates/quanta-memory-platform-core/src/domain/**/*.rs
        - /crates/quanta-memory-platform-core/src/ports/**/*.rs
    pattern-either:
      - pattern: SystemTime::now()
      - pattern: Instant::now()
      - pattern: std::time::SystemTime::now()
      - pattern: std::time::Instant::now()
      - pattern-regex: '\b(?:SystemTime|Instant)::now\b'

  - id: qmp-pure-layer-no-adapter-import
    languages: [rust]
    severity: ERROR
    message: >-
      domain/ and ports/ depend on port traits, never concrete adapters.
    paths:
      include:
        - /crates/quanta-memory-platform-core/src/domain/**/*.rs
        - /crates/quanta-memory-platform-core/src/ports/**/*.rs
    pattern-either:
      - pattern-regex: '(?m)^\s*(?:pub(?:\([^)]*\))?\s+)?use\s+crate::adapters\b'
      - pattern-regex: '(?ms)^\s*(?:pub(?:\([^)]*\))?\s+)?use\s+crate::\{[^;]*\badapters\b'
      - pattern: crate::adapters::$FUNC(...)
