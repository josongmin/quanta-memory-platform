version: 2.1

# Separate pipeline definition with no push trigger. Run manually on a frozen
# commit so performance receipts do not spend credits on every source edit.
jobs:
  in-memory-pressure:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install pinned Rust toolchain
          command: |
            set -euo pipefail
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain none
            fi
            . "$HOME/.cargo/env"
            rustup toolchain install 1.92.0 --profile minimal
            printf 'export PATH="%s:$PATH"\n' "$HOME/.cargo/bin" >> "$BASH_ENV"
      - run:
          name: Collect three independent full in-memory pressure receipts
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            mkdir -p /tmp/qmp-benchmark
            echo "Source SHA: $CIRCLE_SHA1"
            for run in 1 2 3; do
              result="/tmp/qmp-benchmark/results-${run}.jsonl"
              QMP_SCALING_ARTIFACT="$result" \
                scripts/run-scaling-bench.sh --profile=in-memory-pressure
              sha256sum "$result"
            done
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - store_artifacts:
          path: /tmp/qmp-benchmark
          destination: qmp-in-memory-pressure

workflows:
  manual-benchmark:
    jobs:
      - in-memory-pressure
