version: 2.1

jobs:
  full-extraction:
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install pinned verification tools
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y ripgrep shellcheck python3-venv
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
                sh -s -- -y --profile minimal --default-toolchain none
            fi
            . "$HOME/.cargo/env"
            rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt
            python3 -m venv /tmp/qmp-semgrep-venv
            /tmp/qmp-semgrep-venv/bin/pip install semgrep==1.157.0
            cargo install cargo-deny --version 0.19.7 --locked
            printf 'export PATH="%s:/tmp/qmp-semgrep-venv/bin:$PATH"\n' "$HOME/.cargo/bin" >> "$BASH_ENV"
      - run:
          name: Verify tool versions
          command: |
            set -euo pipefail
            rustc --version
            cargo-deny --version
            semgrep --version
            shellcheck --version
      - run:
          name: Verify actual standalone extraction and full workspace gate
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            scripts/verify-extracted-examples.sh

workflows:
  push-verification:
    jobs:
      - full-extraction
