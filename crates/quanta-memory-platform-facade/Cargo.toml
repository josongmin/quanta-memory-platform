[package]
name = "quanta-memory-platform-facade"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["core-live-accounting"]
# Facade-local gate for live-broker accounting paths. Forward core's
# `live_control` feature so the live broker type and controller surfaces are
# present whenever the facade wires the broker in as an accounting sink.
core-live-accounting = ["quanta-memory-platform-core/live_control"]
# Explicit non-production escape hatch. This feature is intentionally absent
# from `default` and `full`; `--all-features` still proves the isolated surface.
unbudgeted-stores = ["core-live-accounting"]
payload_store = ["core-live-accounting"]
retained_map = ["core-live-accounting", "dep:hashlink"]
# Base store/pipeline slices are pure-Rust in-memory and carry NO third-party
# (copyleft) backing deps. Durable/concurrent backings are opt-in via the
# production `spill-redb` or explicit experimental index features below, so a consumer that does not ask
# for a heavy backing never links one (and `full` stays copyleft-free).
revocable_store = ["core-live-accounting"]
transcript = ["core-live-accounting", "dep:blake3"]
publish_pipeline = ["core-live-accounting", "dep:blake3"]
spill = []

# Opt-in heavy backings (each pulls one third-party crate).
spill-redb = ["spill", "dep:redb"]
experimental-revocable-moka-index = ["revocable_store", "dep:moka"]
experimental-revocable-scc-index = ["revocable_store", "dep:scc"]

# `full` = every in-memory slice, deliberately WITHOUT any backing dep, so it is
# free of copyleft transitive dependencies while still including the facade's
# live accounting bridge into core's live-control surface.
full = [
    "core-live-accounting",
    "payload_store",
    "retained_map",
    "revocable_store",
    "transcript",
    "publish_pipeline",
    "spill",
]
# `full-backings` includes only production semantic backings. The moka/scc
# indexes are explicitly experimental because they do not own payload or
# accounting-transfer callbacks.
full-backings = ["full", "spill-redb"]

[[example]]
name = "hello_world"
required-features = ["core-live-accounting"]

[dependencies]
blake3 = { workspace = true, optional = true }
hashlink = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
quanta-memory-platform-core = { path = "../quanta-memory-platform-core", default-features = false }
redb = { workspace = true, optional = true }
scc = { workspace = true, optional = true }
