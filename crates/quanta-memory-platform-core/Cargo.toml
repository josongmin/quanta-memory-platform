[package]
name = "quanta-memory-platform-core"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["live_control"]
pressure = []
# Alias for `live_control`. Weighted group admission lives under
# `application/scheduler.rs` whenever live control is on; there is no
# separate `cfg(feature = "scheduler")` implementation module.
scheduler = ["live_control"]
live_control = ["pressure"]
unbudgeted_pin = []
telemetry = ["dep:metrics", "dep:hdrhistogram"]
full = ["live_control", "telemetry"]

[dependencies]
hdrhistogram = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
