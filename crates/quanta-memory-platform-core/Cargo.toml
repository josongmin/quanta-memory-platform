[package]
name = "quanta-memory-platform-core"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["live_control"]
pressure = []
# Scheduler admission consumes the broker's live ledger view. The public
# scheduler feature therefore selects the complete live-control authority.
scheduler = ["live_control"]
live_control = ["pressure"]
unbudgeted_pin = []
telemetry = ["dep:metrics", "dep:hdrhistogram"]
full = ["live_control", "telemetry"]

[dependencies]
hdrhistogram = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
