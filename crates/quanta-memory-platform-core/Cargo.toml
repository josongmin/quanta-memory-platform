[package]
name = "quanta-memory-platform-core"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["live_control"]
pressure = []
scheduler = []
live_control = ["pressure", "scheduler"]
unbudgeted_pin = []
telemetry = ["dep:metrics", "dep:hdrhistogram"]
full = ["live_control", "telemetry"]

[dependencies]
hdrhistogram = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
